name: wellspring
description: "Empower your health journey with a personalized platform that connects you to vital information, supportive communities, and essential resources, all while helping you track your progress with ease."
publish_to: "none"
version: 1.0.0+23

environment:
  sdk: ^3.6.0

dependencies:
  flutter_timezone: ^5.0.0
  timezone: ^0.10.1
  flutter_local_notifications: ^20.0.0
  concentric_transition: ^1.0.0
  health: ^12.2.0
  firebase_analytics: ^12.0.0
  url_launcher: ^6.3.0
  cloud_functions: ^6.0.0
  showcaseview: ^5.0.0
  geolocator: 13.0.4
  http: ^1.2.1
  file_picker: '>=8.1.2'
  firebase_storage: ^13.0.0
  firebase_core: ^4.3.0
  cloud_firestore: '>=5.5.0'
  firebase_auth: '>=5.3.3'
  video_player: '>=2.9.2'
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  go_router: ^17.0.0
  shared_preferences: ^2.0.0
  intl: 0.20.2
  fl_chart: 0.68.0
  reorderables: 0.6.0
  supabase_flutter: '>=1.10.0'
  uuid: ^4.0.0
  google_fonts: ^6.0.0
  table_calendar: ^3.0.0
  html: 0.15.6
  sign_in_with_apple: '>=6.1.2'
  crypto: ^3.0.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/conditions_catalog.json
    - assets/images/
    - assets/other/
    - assets/documents/
    - assets/text/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/ChatGPT_Image_Jun_17_2026_02_11_36_PM.png
  remove_alpha_ios: true
